# One-time helper: applies a source payload from the build environment.
#
# Why this exists: the sandbox has no GitHub push credentials, so the files are
# transferred as a checksum-verified archive and committed here, using the
# repository's own token. It is deleted immediately after it runs.
name: sync-source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch and verify payload
        run: |
          set -euo pipefail
          URL='https://static.teamily.ai/files/9ee38175-b440-4310-8aa7-8117f8d4ff6c/sholab-v3.tgz?tk=ZmlsZTo5ZWUzODE3NS1iNDQwLTQzMTAtOGFhNy04MTE3ZjhkNGZmNmM6MTc5NDI3NjI1MA.ODM1MTdjOGRkOGQyZWYxNzJkNmFkY2U3ZmQ5NWRhNzY'
          curl -fsSL --retry 4 --retry-delay 3 -o /tmp/payload.tgz "$URL"
          ls -l /tmp/payload.tgz
          echo "cb91c19c348acb68e3f0150b754cbb9d851b226dcac47a3395131c30e7ed3fc8  /tmp/payload.tgz" | sha256sum -c -
          echo "checksum OK"
          tar -xzf /tmp/payload.tgz -C "$GITHUB_WORKSPACE"
          echo "extracted:"
          find . -newermt '-2 minutes' -type f -not -path './.git/*' | sort

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name 'Sholab Site Bot'
          git config user.email 'bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: implement website brief v2

Implements the client brief across the public site and the /sholab panel:

- WhatsApp smart-quote popup rebuilt to the brief's spec: required name
  field, service grouped by category, package selector, and the exact
  pre-filled message wording.
- Every WhatsApp button now opens that popup with its own selection:
  nav, hero, each service card, each pricing card, contact, footer and
  the floating button.
- Services gained a per-card 'Chat on WhatsApp' button.
- Pricing gained the package comparison table.
- Contact gained a map placeholder; Footer gained a discreet Site Control
  link; README gained a 'How to update this site' guide.
- Admin panel split into the twelve briefed tabs, adding Media (8.8),
  SEO (8.9) and Settings with Reset to default (8.10).
- SEO/favicon/OG tags now applied at runtime from settings.
- New tests pin the WhatsApp message wording."
          git push origin HEAD:main
