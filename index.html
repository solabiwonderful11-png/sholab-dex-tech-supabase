<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1120" />

    <title>Sholab Dex Tech | Websites, AI Automation &amp; Business Promotions</title>
    <meta
      name="description"
      content="Sholab Dex Tech builds modern websites, sets up AI automation, and runs business promotions that help you get more customers and save time. Get a free quote today."
    />
    <meta
      name="keywords"
      content="website development Nigeria, AI automation, business promotion, WhatsApp chatbot, e-commerce website, social media management, Sholab Dex Tech"
    />
    <meta name="author" content="Sholab Dex Tech" />
    <link rel="canonical" href="/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sholab Dex Tech | Websites, AI Automation &amp; Business Promotions" />
    <meta
      property="og:description"
      content="Websites, AI automation and business promotions — built to help your business grow."
    />
    <meta property="og:site_name" content="Sholab Dex Tech" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sholab Dex Tech" />
    <meta
      name="twitter:description"
      content="Websites, AI automation and business promotions — built to help your business grow."
    />

    <!-- Favicon: inline SVG so there is no extra request and no missing-file 404 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230ea5e9'/%3E%3Ctext x='50' y='68' font-size='54' font-family='system-ui,sans-serif' font-weight='700' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E"
    />

    <!--
      Theme is applied BEFORE first paint. Without this the page would flash the
      light theme for a frame before React mounts and reads localStorage.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("sholab-theme") || "system";
          var dark =
            stored === "dark" ||
            (stored === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* private mode — fall back to the light theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/client/src/main.tsx"></script>
  </body>
</html>
